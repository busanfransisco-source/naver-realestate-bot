name: Verify Neonet weekly source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Test parser and live repeatability
        run: |
          python -m unittest test_neonet_trend -v
          python neonet_trend.py --check
