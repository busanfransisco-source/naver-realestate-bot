name: Nationwide Transaction Refresh

on:
  workflow_dispatch: {}
  schedule:
    # 05:10~08:50 KST, 20분 간격. 당일 첫 성공 뒤에는 수집기가 자동으로 건너뛴다.
    - cron: "10,30,50 20-23 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nationwide-transactions
  cancel-in-progress: false

jobs:
  refresh-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect nationwide apartment transactions
        run: python realestate_transactions_fetch.py --skip-if-collected-today
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}

      - name: Commit collected transaction files
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- transactions.txt transactions-*.txt transactions-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transactions.txt transactions-*.txt transactions-state.json
          git commit -m "Update nationwide apartment transactions"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate briefing after successful collection
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run manual-briefing.yml --ref main
