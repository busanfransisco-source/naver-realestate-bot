name: Nationwide Transaction Refresh

on:
  workflow_dispatch: {}
  schedule:
    # 05:10~08:10 KST, 매시간. 새로 보강된 거래는 같은 날 계속 합친다.
    - cron: "10 20 * * *"
    - cron: "10 21 * * *"
    - cron: "10 22 * * *"
    - cron: "10 23 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nationwide-transactions
  cancel-in-progress: false

jobs:
  refresh-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect nationwide official transactions
        run: python realestate_transactions_fetch.py
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}

      - name: Commit collected transaction files
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- transactions.txt transactions-*.txt transactions-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transactions.txt transactions-*.txt transactions-state.json
          git commit -m "Update nationwide apartment transactions"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate briefing after successful collection
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run manual-briefing.yml --ref main
