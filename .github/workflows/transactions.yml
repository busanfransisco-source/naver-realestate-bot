name: Nationwide Transaction Refresh

on:
  workflow_dispatch:
    inputs:
      baseline_only:
        description: "현재 전국 자료를 비교 기준으로만 다시 저장"
        required: false
        default: false
        type: boolean
  schedule:
    # 05:10~08:50 KST, 20분 간격. 당일 첫 성공 뒤에는 수집기가 자동으로 건너뛴다.
    - cron: "10,30,50 20-23 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nationwide-transactions
  cancel-in-progress: false

jobs:
  refresh-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect nationwide apartment transactions
        shell: bash
        run: |
          if [ "${{ inputs.baseline_only }}" = "true" ]; then
            python realestate_transactions_fetch.py --source csv --baseline-only
          else
            python realestate_transactions_fetch.py --source csv --skip-if-collected-today
          fi

      - name: Commit collected transaction files
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- transactions.txt transactions-*.txt transactions-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transactions.txt transactions-*.txt transactions-state.json
          git commit -m "Update nationwide apartment transactions"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate briefing after successful collection
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run manual-briefing.yml --ref main
