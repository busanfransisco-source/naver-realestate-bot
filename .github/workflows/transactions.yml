name: Nationwide Transaction Refresh

on:
  workflow_dispatch: {}
  schedule:
    # 05:10~08:10 KST, 매시간. 새로 보강된 거래는 같은 날 계속 합친다.
    - cron: "10 20 * * *"
    - cron: "10 21 * * *"
    - cron: "10 22 * * *"
    - cron: "10 23 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nationwide-transactions
  cancel-in-progress: false

jobs:
  refresh-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect nationwide official transactions
        shell: bash
        run: |
          # A brief API timeout must not leave today's box pending until tomorrow.
          for attempt in 1 2; do
            if python realestate_transactions_fetch.py; then
              exit 0
            fi
            if [ "$attempt" = "2" ]; then
              echo "Transaction collection failed twice; no fabricated zero published."
              exit 1
            fi
            echo "Collection failed; retrying once after 30 seconds."
            sleep 30
          done
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}

      - name: Commit collected transaction files
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- transactions.txt transactions-*.txt transactions-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python gen_briefing.py
          git add transactions.txt transactions-*.txt transactions-state.json briefing.html
          git commit -m "Update nationwide apartment transactions"
          git pull --rebase origin main
          python gen_briefing.py
          git add briefing.html
          git diff --cached --quiet || git commit -m "Regenerate briefing from merged sources"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify every published briefing card
        if: steps.commit.outputs.changed == 'true'
        run: python briefing_health.py --url https://busanfransisco-source.github.io/naver-realestate-bot/briefing.html

      - name: Save per-card health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-health
          path: briefing-health.json
          retention-days: 7
