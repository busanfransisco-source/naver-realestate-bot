name: Nationwide Transaction Refresh
on:
  workflow_dispatch: {}
  workflow_call: {}
  schedule:
    # 05:10~08:10 KST; GitHub scheduling can be delayed.
    - cron: "10 20 * * *"
    - cron: "10 21 * * *"
    - cron: "10 22 * * *"
    - cron: "10 23 * * *"
    # 09:35~17:35 KST: retry missing dawn data even when other briefings are delayed.
    - cron: "35 0-8 * * *"
permissions:
  contents: write
concurrency:
  group: nationwide-transactions
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    outputs:
      eligible: ${{ steps.window.outputs.eligible }}
    steps:
      - name: Defer before actual 05-00 KST source publication
        id: window
        run: |
          python - <<'PYCODE'
          import os
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=9)))
          eligible = now.hour >= 5
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('eligible='+str(eligible).lower()+'\n')
          print('Transaction collection eligible:', eligible, 'actual KST:', now.isoformat())
          if not eligible:
              print('Deferred before 05:00 KST; no collection, source upload or publication.')
          PYCODE
      - uses: actions/checkout@v4
        if: steps.window.outputs.eligible == 'true'
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: steps.window.outputs.eligible == 'true'
        with:
          python-version: "3.11"
      - name: Install all collection and publication dependencies
        if: steps.window.outputs.eligible == 'true'
        run: pip install -r requirements.txt
      - name: Preflight publication before expensive collection
        if: steps.window.outputs.eligible == 'true'
        run: |
          python -c "import requests, bs4; import gen_briefing; from production_data_cards import load_contents; gen_briefing.build_html(new_data_contents=load_contents())"
      - name: Collect nationwide official transactions
        if: steps.window.outputs.eligible == 'true'
        shell: bash
        run: |
          # Preserve a verified daily source, or recover the complete 05:00 batch.
          if python ensure_transactions_daily.py; then
            # Retry only the auxiliary CSV under its own 20-second wall-clock budget.
            # Its failure does not block publication or trigger nationwide recollection.
            python realestate_transactions_fetch.py --refresh-presale-only || echo "Presale remains unconfirmed; publish verified apartments"
            exit 0
          fi
          for attempt in 1 2; do
            if python realestate_transactions_fetch.py; then
              if python ensure_transactions_daily.py --check-only; then
                exit 0
              fi
              echo "Collector returned without a completed today source; retrying"
            fi
            if [ "$attempt" = "2" ]; then
              echo "Collection failed twice; no fabricated zero published."
              exit 1
            fi
            sleep 30
          done
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      - name: Preserve collected source independently of publication
        if: always() && steps.window.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: transaction-source
          path: |
            transactions.txt
            transactions-*.txt
            transactions-state.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error
  publish:
    needs: collect
    if: needs.collect.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: manual-briefing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publication dependencies
        run: pip install -r requirements.txt
      - name: Restore this run's completed collection
        uses: actions/download-artifact@v4
        with:
          name: transaction-source
      - name: Persist source before rendering pages
        run: |
          python ensure_transactions_daily.py --check-only
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transactions.txt transactions-*.txt transactions-state.json
          git diff --cached --quiet || git commit -m "Persist completed nationwide transaction collection"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Render and publish latest merged briefing
        run: |
          python gen_briefing.py
          git add briefing.html
          git diff --cached --quiet || git commit -m "Publish briefing with completed transactions"
          git push origin HEAD:main
      - name: Verify today's transaction body and all published cards
        run: |
          python verify_transaction_publication.py
          python briefing_health.py --url https://busanfransisco-source.github.io/naver-realestate-bot/briefing.html
      - name: Save per-card health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-health
          path: briefing-health.json
          retention-days: 7
          overwrite: true
