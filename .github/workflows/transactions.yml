name: Nationwide Transaction Refresh

on:
  workflow_dispatch: {}
  schedule:
    # 05:10~08:50 KST, 20분 간격. 새로 보강된 거래도 같은 날 계속 합친다.
    - cron: "10,30,50 20-23 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nationwide-transactions
  cancel-in-progress: false

jobs:
  refresh-transactions:
    # apt.today가 일부 Linux 데이터센터 IP를 429로 제한한다. Windows 풀은
    # 별도 네트워크 대역을 사용하므로 원본 HTML을 직접 읽을 수 있다.
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser-compatible collector
        run: pip install curl-cffi

      - name: Collect the published 05:00 transaction batch
        run: python apt_today_closings_fetch.py

      - name: Commit collected transaction files
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- transactions.txt transactions-*.txt transactions-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transactions.txt transactions-*.txt transactions-state.json
          git commit -m "Update nationwide apartment transactions"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate briefing after successful collection
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run manual-briefing.yml --ref main
