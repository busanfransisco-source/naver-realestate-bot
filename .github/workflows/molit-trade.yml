name: MOLIT Trade Data Fetch

on:
  schedule:
    # 매일 06:10 KST = 21:10 UTC (전일) — 다른 브리핑 워크플로우들과 겹치지 않는 시각
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: false
        default: "all"
        type: choice
        options: [all, incremental, backfill]

permissions:
  contents: write

concurrency:
  group: molit-trade
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch MOLIT apartment trades
        run: python molit_trade_fetch.py --mode "${{ github.event.inputs.mode || 'all' }}"
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}

      - name: Commit and push raw data + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trades molit_backfill_state.json
          git diff --cached --quiet && echo "No changes" || git commit -m "MOLIT trade data update"
          git pull --rebase origin main
          git push
