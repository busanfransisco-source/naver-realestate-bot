name: Refresh three daily data cards
on:
  workflow_dispatch:
    inputs:
      card:
        description: Card to refresh
        type: choice
        default: seoulcommerce
        options: [seoulcommerce, cryptofear, wikiinterest]
  schedule:
    # Each card once a day: KST crypto09:15 / wiki10:15 / Seoul18:15.
    - cron: '15 0 * * *'
    - cron: '15 1 * * *'
    - cron: '15 9 * * *'
permissions:
  contents: write
concurrency:
  group: manual-briefing
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect fresh source snapshots (no power calls)
        run: python production_data_cards.py --collect --card "$REFRESH_CARD"
        env:
          REFRESH_CARD: ${{ inputs.card || (github.event.schedule == '15 0 * * *' && 'cryptofear') || (github.event.schedule == '15 1 * * *' && 'wikiinterest') || 'seoulcommerce' }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
      - name: Publish cache and regenerate all 29 cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data-cards.json
          git diff --cached --quiet || git commit -m 'Refresh three data card source snapshots'
          git pull --rebase origin main
          python gen_briefing.py
          git add briefing.html
          git diff --cached --quiet || git commit -m 'Regenerate 29-card briefing from latest sources'
          git push origin HEAD:main
      - name: Verify public deployment and remaining source lifetime
        run: python audit_data_cards.py
      - name: Save source and deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-card-deployment-audit
          path: tmp/data-card-deployment-audit.json
          retention-days: 7
