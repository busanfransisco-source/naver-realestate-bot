name: Refresh three daily data cards
on:
  workflow_dispatch:
    inputs:
      card:
        description: Card to refresh
        type: choice
        default: seoulcommerce
        options: [seoulcommerce, cryptofear, wikiinterest]
  schedule:
    # KST crypto09:15 / wiki10:15. Seoul uses its independent early-start collector.
    - cron: '15 0 * * *'
    - cron: '15 1 * * *'
    # PC-independent catch-up samples. Actual source clocks remain visible.
    - cron: '17,47 0-12 * * *'
permissions:
  contents: write
concurrency:
  group: manual-briefing
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect fresh source snapshots (no power calls)
        id: collect
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            if python production_data_cards.py --collect --card "$REFRESH_CARD" --require-fresh; then
              exit 0
            fi
            if [ "$attempt" = "2" ]; then
              exit 1
            fi
            echo "Source refresh rejected; retrying once after 30 seconds."
            sleep 30
          done
        env:
          REFRESH_CARD: ${{ inputs.card || (github.event.schedule == '15 0 * * *' && 'cryptofear') || (github.event.schedule == '15 1 * * *' && 'wikiinterest') || 'seoulcommerce' }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
      - name: Backstop missing today Seoul snapshot during daytime
        run: python ensure_seoul_daily.py || echo "Seoul source still unavailable; dated snapshot retained"
        env:
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
      - name: Publish cache and regenerate all 29 cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data-cards.json seoul-time-snapshots.json
          git diff --cached --quiet || git commit -m 'Refresh three data card source snapshots'
          git pull --rebase origin main
          python gen_briefing.py
          git add briefing.html
          git diff --cached --quiet || git commit -m 'Regenerate 29-card briefing from latest sources'
          git push origin HEAD:main
      - name: Verify public deployment and remaining source lifetime
        run: python audit_data_cards.py
      - name: Verify every published briefing card
        run: python briefing_health.py --url https://busanfransisco-source.github.io/naver-realestate-bot/briefing.html
      - name: Save per-card health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-health
          path: briefing-health.json
          retention-days: 7
      - name: Fail visibly when the requested source was not refreshed
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Requested source was not refreshed. Prior dated snapshot was preserved, not reported as new data.'
          exit 1
      - name: Save source and deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-card-deployment-audit
          path: tmp/data-card-deployment-audit.json
          retention-days: 7
