name: Manual Briefing Refresh

on:
  push:
    paths:
      - "trigger.txt"
  workflow_dispatch: {}
  schedule:
    - cron: "55 18 * * *"
    - cron: "25 19 * * *"
    - cron: "55 19 * * *"
    - cron: "25 20 * * *"
    - cron: "55 20 * * *"
    - cron: "25 21 * * *"
    - cron: "55 21 * * *"
    - cron: "25 22 * * *"
    - cron: "55 22 * * *"
    - cron: "7 3 * * *"
    - cron: "7 7 * * *"
    - cron: "7 11 * * *"
    - cron: "53 14 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: manual-briefing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # A queued run may have been created before the previous run pushed.
          # Always start from the latest main branch to avoid rebase conflicts.
          ref: main

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch weather
        run: python weather_fetch.py || echo "weather failed; per-card recovery will retry"

      - name: Fetch fortune
        run: python fortune_fetch.py || echo "fortune failed; per-card recovery will retry"

      - name: Fetch realestate news
        run: python naver_realestate_fetch.py || echo "realestate failed; per-card recovery will retry"

      - name: Fetch realestate policy analysis candidates
        run: python naver_realestate_analysis_fetch.py || echo "analysis candidates failed"

      - name: Fetch daum short news
        run: python daum_news_fetch.py > shortnews-debug.log 2>&1 || true; tail -20 shortnews-debug.log

      - name: Fetch world news
        run: python world_news_fetch.py || echo "world news failed"

      - name: Fetch finance news
        run: python finance_news_fetch.py || echo "finance news failed"

      - name: Fetch AI news
        run: python ai_news_fetch.py || echo "AI news failed"

      # 전용 실거래 예약 작업이 GitHub 스케줄러에서 누락되더라도,
      # 정상적으로 자주 실행되는 브리핑 작업이 아침 세 차례 다시 호출한다.
      # 실거래 작업 자체의 concurrency가 중복 실행을 순서대로 처리한다.
      - name: Backstop nationwide transaction refresh
        if: >-
          github.event_name == 'schedule' &&
          (github.event.schedule == '25 20 * * *' ||
           github.event.schedule == '25 21 * * *' ||
           github.event.schedule == '25 22 * * *')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run transactions.yml --ref main ||
          echo "transaction backstop dispatch failed; dedicated schedule will retry"

      - name: Fetch market info
        run: python market_fetch.py || echo "market failed"

      - name: Fetch aptinfo
        run: python aptinfo_fetch.py || echo "aptinfo failed"
        env:
          RONE_KEY: ${{ secrets.RONE_KEY }}

      - name: Backstop missing today Seoul snapshot during daytime
        run: python ensure_seoul_daily.py || echo "Seoul source still unavailable; dated snapshot retained"
        env:
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}

      - name: Regenerate pages and commit everything
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python gen_index.py
          python gen_briefing.py
          python briefing_health.py --repair || echo "Some cards remain incomplete; final public gate will report failure"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-refresh.txt
          git add shortnews.txt shortnews-*.txt shortnews-debug.log || true
          git add world.txt world-*.txt || true
          git add finance.txt finance-*.txt || true
          git add ai.txt ai-*.txt || true
          git add subs.txt subs-*.txt trend.txt trend-*.txt neonet-trend-cache.json || true
          git add fuelfx.txt fuelfx-*.txt metalcoin.txt metalcoin-*.txt books.txt books-*.txt fx-cache.json fuel-cache.json || true
          git add transactions.txt transactions-*.txt transactions-state.json || true
          git add weather.txt weather-*.txt fortune.txt fortune-*.txt realestate.txt realestate-*.txt latest.json latest-*.json index.html hub.html briefing.html last-refresh.txt
          git add realestate-analysis-candidates.json || true
          git add data-cards.json
          git commit -m "Manual briefing refresh" --allow-empty
          git pull --rebase origin main
          git push

      - name: Verify every published briefing card
        run: python briefing_health.py --url https://busanfransisco-source.github.io/naver-realestate-bot/briefing.html

      - name: Save per-card health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-health
          path: briefing-health.json
          retention-days: 7
