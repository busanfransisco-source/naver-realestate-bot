name: Manual Briefing Refresh

on:
  push:
    paths:
      - "trigger.txt"
  workflow_dispatch: {}
  schedule:
    - cron: "55 18 * * *"
    - cron: "25 19 * * *"
    - cron: "55 19 * * *"
    - cron: "25 20 * * *"
    - cron: "55 20 * * *"
    - cron: "25 21 * * *"
    - cron: "55 21 * * *"
    - cron: "25 22 * * *"
    - cron: "55 22 * * *"
    - cron: "7 3 * * *"
    - cron: "7 7 * * *"
    - cron: "7 11 * * *"
    - cron: "53 14 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: manual-briefing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # A queued run may have been created before the previous run pushed.
          # Always start from the latest main branch to avoid rebase conflicts.
          ref: main

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect independent sources with bounded concurrency
        run: python collect_briefing.py || echo "Some collectors failed; healthy sources remain available and the public gate will report omissions"
        env:
          RONE_KEY: ${{ secrets.RONE_KEY }}
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}

      - name: Regenerate pages and commit everything
        env:
          RONE_KEY: ${{ secrets.RONE_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python gen_index.py
          python gen_briefing.py
          python briefing_health.py --repair --skip-collected || echo "Some cards remain incomplete; final public gate will report failure"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-refresh.txt
          git add shortnews.txt shortnews-*.txt shortnews-debug.log || true
          git add world.txt world-*.txt || true
          git add finance.txt finance-*.txt || true
          git add ai.txt ai-*.txt || true
          git add subs.txt subs-*.txt trend.txt trend-*.txt neonet-trend-cache.json || true
          git add fuelfx.txt fuelfx-*.txt metalcoin.txt metalcoin-*.txt books.txt books-*.txt fx-cache.json fuel-cache.json || true
          git add transactions.txt transactions-*.txt transactions-state.json || true
          git add weather.txt weather-*.txt fortune.txt fortune-*.txt realestate.txt realestate-*.txt latest.json latest-*.json last-refresh.txt
          git add realestate-analysis-candidates.json || true
          git add data-cards.json seoul-time-snapshots.json
          git add supply-demand-cache.json
          git diff --cached --quiet || git commit -m "Manual briefing source refresh"
          git restore --worktree -- index.html hub.html briefing.html
          git pull --rebase origin main
          python gen_index.py
          python gen_briefing.py
          git add index.html hub.html briefing.html
          git diff --cached --quiet || git commit -m "Manual briefing refresh"
          git push

      - name: Verify every published briefing card
        run: python briefing_health.py --url https://busanfransisco-source.github.io/naver-realestate-bot/briefing.html

      - name: Save per-card health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-health
          path: briefing-health.json
          retention-days: 7
