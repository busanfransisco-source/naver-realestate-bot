🏛️ (정치) 국민의힘이 &#x27;부정선거론&#x27;을 놓고 둘로 쪼개졌다. 쟁점은 투표율 조작이 득표율 조작으로 이어질 수 있느냐다.

💰 (경제) 양준혁은 이때 받은 계약금 10억원을 소비보다 자산으로 옮겼다. 2005년 삼성과 2년간 15억원에 재계약하면서 받은 계약금 5억원 역시 부동산 투자의 종잣돈으로 활용한 것으로 알려졌다.

💰 (경제) 삼성전자와 SK하이닉스 주가가 사흘 연속 뛰었다. 급락장에서 두 종목을 대거 팔았던 외국인도 다시 돌아왔다.

💰 (경제) “이거야, 이거!” 지난 11일 서울 마포구 홍대 삼성스토어. 10대 여학생 3명이 매장에 들어서자마자 ‘갤럭시 Z폴드8’ 앞으로 향했다.

💰 (경제) 손으로 누르고 주무르고 만지면서 촉각과 소리를 즐기는 ‘촉감 소비’가 10~20대를 중심으로 새로운 놀이 문화로 자리 잡고 있다. 단순한 재미를 넘어 스트레스를 풀기 위한 기분 전환 수단으로 활용하는 소비자도 적지 않은 것으로 나타났다.

💰 (경제) SK하이닉스 역시 6월25일 장중 298만 7000원까지 오르며 최고가를 기록한 뒤 7월29일 53.1% 하락한 140만 1000원까지 떨어졌다. 7월30일 132만 2000원으로 저점을 다진 뒤 7월31일 하루 만에 29.9% 급등했다.

👥 (사회) 내년부터 서울시내버스의 대부분을 차지하는 압축천연가스(CNG) 버스가 순차적으로 크게 줄어든다. 폐차하는 CNG 버스는 친환경차량 보급 확대기조에 따라 전기·수소버스 등 무공해 버스로 대체할 예정이지만 충전소 부지 설치가 마땅치 않아 대책이 필요하다는 지적이 나온다.

👥 (사회) “이걸로 자식들 다 키웠는데… 아쉽지만 방법이 없습니다.” 13일 오전 서울 종로구 신진시장. ‘보신탕집 거리’로 잘 알려진 이곳에서 40년째 가게를 운영하고 있는 이모(75)씨는 한숨을 내쉬며 이같이 말했다.

👥 (사회) 미국 록펠러대 폴 코언 박사팀은 14일 의학 저널 셀 리포츠 메디신(Cell Reports Medicine)에서 젊고 건강한 남성들을 대상으로 전력 질주 인터벌 운동(SIE)과 중강도 운동(MIE)의 효과를 비교한 결과 이같이 나타났다고 밝혔다. 코언 박사는 &quot;단 몇 분간의 고강도 운동이 혈액 내에 상당한 분자 수준의 반응을 유발할 수 있다&quot;며 &quot;8주간 훈련 후에도 이런 반응이 유지되는 것은 이 반응이 단순히 몸이 익숙하지 않은 스트레스에 적응한 결과만은 아님을 보여준다&quot;고 말했다.

👥 (사회) 대구시와 상인들에 따르면 10여 년 전만 해도 보신탕 식당과 개고기 정육점, 건강원 등 50여 곳이 골목을 빼곡히 채웠다. 하지만 대부분 문을 닫아 지금은 식당 4곳과 건강원 1, 2곳만이 간신히 명맥을 잇는 수준이다.

👥 (사회) “국회에 들어오게 된 큰 이유 중 하나가 역사 분야에서 정의를 되찾는 것이었습니다.” 오는 12월 2일 시행하는 ‘친일반민족행위자 재산의 국가귀속 등에 관한 특별법’(친일재산귀속특별법)의 대표발의자인 김용만 의원(더불어민주당)은 최근 이데일리와의 인터뷰에서 이번 특별법의 의미를 이같이 전했다. 김 의원은 백범 김구 선생의 증손자다.

👥 (사회) 친일반민족행위자와 후손의 재산을 국고로 귀속시키기 위한 친일재산조사위원회(조사위)가 오는 12월 다시 문을 연다. 2010년 이후 사실상 16년간 멈춰있던 국가 차원의 친일재산환수 움직임이다.

👥 (사회) 이에 지역건설업계도 성명을 통해 대구시의 지역 건설산업 활성화 시책에 대해 환영의 입장을 밝혔다. 대구 건설경기는 2017년 이후 지속적으로 성장하며 2020년에 수주액 9조 원 이상을 달성하는 등 2022년까지 호황기를 누렸으나, 이후 미분양 등 주택경기가 위축되면서 건설업도 2024년 -21.4%, 2025년 -19.2%로 2년 연속 급격히 역성장하며 지역 경제 침체의 주요 원인으로 작용했다.

👥 (사회) 2021년 대만은 56년 만에 최악의 가뭄을 겪었다. 저수지가 말라붙자 대만정부는 지역별 제한 급수에 들어갔다.

🌏 (국제) 일본의 대표적인 술집 ‘이자카야’가 빠르게 설 자리를 잃고 있다. 식재료와 임대료, 공공요금 등 각종 비용이 치솟는 데다 퇴근 후 술집에 들러 2차, 3차까지 이어가던 음주 문화마저 약해지면서다.

🌏 (국제) ※[글로벌 모닝 브리핑]은 서울경제가 전하는 글로벌 소식을 요약해 드립니다. 가격 경쟁력도 여전히 강점입니다.

<script>
// 홈 화면/사파리가 옛 사본을 보여줄 때: 페이지 날짜가 오늘과 다르면 캐시를 우회해 1회 다시 불러온다
var BUILD_DATE = '2026-08-14';
(function() {
  var d = new Date();
  var today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  if (today !== BUILD_DATE && location.search.indexOf('r=') === -1) {
    location.replace(location.pathname + '?r=' + Date.now());
  }
})();

function markCopied(btn) {
  const original = btn.textContent;
  btn.textContent = '복사됨';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 1200);
}

function copySection(key, btn) {
  // execCommand는 동기적으로 바로 결과가 나오고 권한 프롬프트로 멈추는 일이
  // 없어서 이걸 기본으로 쓴다. navigator.clipboard는 일부 브라우저(특히
  // 자동화/인앱 웹뷰 환경)에서 권한 대기 상태로 무한정 멈출 수 있어서
  // 보조 수단으로만 쓴다.
  const ta = document.getElementById('ta-' + key);
  let copied = false;
  try {
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    copied = document.execCommand('copy');
  } catch (e) {
    copied = false;
  }

  if (copied) {
    markCopied(btn);
    return;
  }

  const text = window['__content_' + key];
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => markCopied(btn)).catch(() => {
      alert('복사에 실패했습니다. 아래 미리보기 텍스트를 직접 길게 눌러 복사해주세요.');
    });
  } else {
    alert('복사에 실패했습니다. 아래 미리보기 텍스트를 직접 길게 눌러 복사해주세요.');
  }
}
</script>
