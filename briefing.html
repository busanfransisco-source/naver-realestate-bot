🏛️ (정치) 더불어민주당이 30일 법원의 공소기각 사유를 확대하고 검찰의 수사권을 완전 폐지하는 형사소송법 개정안의 국회 본회의 상정을 강행했다. 국민의힘은 필리버스터(무제한 토론)에 돌입했으나 민주당은 31일 토론을 강제 종료하고 법안을 처리할 예정이다.

💰 (경제) 레버리지 등 투자 열기 키웠지만 당국 총량규제 같은 뒷북 대응뿐 코스피가 사흘 연속 무너지면서 시가총액 922조원이 증발했다. 30일 코스피는 전날보다 69.68포인트(1.23%) 내린 5593.56으로 장을 마쳤다.

💰 (경제) 숙련기술인의 최고 정점인 ‘대한민국명장’은 최소 15년이 넘는 세월 동안 현장에서 기술을 갈고 닦아온 장인들의 영예다. 명장 반열에 오르는 나이는 평균 50대 중후반을 훌쩍 넘기고, 높은 진입장벽 탓에 청년층에겐 언제나 ‘먼 나라 이야기’일 뿐이었다.

💰 (경제) &quot; AI(인공지능)와 관련된 반도체 주식을 향한 탐욕이 공포로 바뀌었다. (스위스 금융사 UBP의 베이 선 링 주식 분석가) &quot; 7월 초만 해도 국내외 증권가에선 ‘삼전닉스(삼성전자+SK하이닉스)’에 대한 장밋빛 기대가 컸다.

💰 (경제) 31일 뉴시스 취재에 따르면 방배동 재건축 단지 인근 공인중개사 사무소들은 대체로 활기를 띠었다. 지난해 말 입주를 시작한 래미안 원페를라(6구역·1097가구)에 이어 오는 9월에는 방배동 대장단지로 불리는 디에이치 방배(5구역·3064가구)가 입주를 앞두고 있어서다.

👥 (사회) 더불어민주당 주도로 30일 국회 본회의에 상정된 형사소송법 개정안과 선거관리위원회 수사를 위한 특검법이 충돌한다는 지적이 나온다. 특검법은 6·3 지방선거 진상규명 수사를 위해 파견 검사를 두도록 규정했다.

👥 (사회) 경기 수원에서 자녀 다섯을 키우는 유도은 씨(42)는 2020년 유산 후유증으로 인한 통원 치료가 길어지면서 결국 직장을 그만뒀다. 이후 팬데믹이 찾아오면서 다시 일자리를 구하지 못한 채 개인 파산에 몰렸다.

👥 (사회) 지난 8일 오전 8시 서울 강서구에 있는 항만 설계 및 토목 관리 기업 ‘혜인이엔씨’ 사무실. 이 회사 조대승(50) 이사는 다른 직원들보다 1시간 먼저 출근했다.

👥 (사회) 헤비메탈 기타리스트 황영선씨가 무대에 오르기 전 말했다. 올해 팔순인 그는 관객이 기자 한 명뿐인 공연을 앞두고도 대형 무대를 준비하는 연주자처럼 장비를 꼼꼼히 점검했다.

👥 (사회) 제10대 원주시의회가 올 7월 1일, 원주시민 선택을 받은 지역 일꾼 26명으로 구성, 힘차게 출범했다. 앞으로 4년간 원주시 주요 정책과 예산을 심의·의결하고 집행부를 견제하며 지역 발전 방향을 제시할 ‘정책 길잡이’ 역할이 기대된다.

👥 (사회) 오는 2029년 완공을 목표로 추진 중인 춘천-속초 동서고속화철도는 화천을 비롯한 양구, 인제 등 경유지역 지자체의 접근성 개선에도 획기적인 변화를 불러올 것으로 기대를 모으고 있다. 화천군은 역세권 개발 등 동서고속화철도의 효율을 극대화하기 위한 다각적인 노력을 기울이고 있다.

👥 (사회) 춘천에서 고성까지는 두 시간이 조금 넘게 걸린다. 길게만 느껴졌던 서울양양고속도로를 통과하는 일도 이제는 제법 익숙하다.

👥 (사회) 뇌병변 장애는 뇌 손상으로 일상의 움직임에 제약을 받는 신체장애다. 지난해 기준 장애 유형 가운데 다섯 번째(8.9%)로 큰 비중을 차지하고 있다.

🌏 (국제) 미국 민주당이 들썩이고 있다. 오는 11월 중간선거에 나설 후보를 뽑는 경선에서 민주사회주의(Democratic Socialists of America·DSA) 정치인들의 승리가 이어지면서다.

🌏 (국제) 세계 농업이 올해 ‘슈퍼 엘니뇨’ 발생 가능성에 긴장하고 있다. 세계기상기구(WMO)와 미국 해양대기청(NOAA), 일본기상협회 등이 하반기 강한 엘니뇨 발생 가능성을 잇달아 전망하면서다.

<script>
// 홈 화면/사파리가 옛 사본을 보여줄 때: 페이지 날짜가 오늘과 다르면 캐시를 우회해 1회 다시 불러온다
var BUILD_DATE = '2026-07-31';
(function() {
  var d = new Date();
  var today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  if (today !== BUILD_DATE && location.search.indexOf('r=') === -1) {
    location.replace(location.pathname + '?r=' + Date.now());
  }
})();

function markCopied(btn) {
  const original = btn.textContent;
  btn.textContent = '복사됨';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 1200);
}

function copySection(key, btn) {
  // execCommand는 동기적으로 바로 결과가 나오고 권한 프롬프트로 멈추는 일이
  // 없어서 이걸 기본으로 쓴다. navigator.clipboard는 일부 브라우저(특히
  // 자동화/인앱 웹뷰 환경)에서 권한 대기 상태로 무한정 멈출 수 있어서
  // 보조 수단으로만 쓴다.
  const ta = document.getElementById('ta-' + key);
  let copied = false;
  try {
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    copied = document.execCommand('copy');
  } catch (e) {
    copied = false;
  }

  if (copied) {
    markCopied(btn);
    return;
  }

  const text = window['__content_' + key];
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => markCopied(btn)).catch(() => {
      alert('복사에 실패했습니다. 아래 미리보기 텍스트를 직접 길게 눌러 복사해주세요.');
    });
  } else {
    alert('복사에 실패했습니다. 아래 미리보기 텍스트를 직접 길게 눌러 복사해주세요.');
  }
}
</script>
