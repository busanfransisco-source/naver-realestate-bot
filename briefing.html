🏛️ (정치) 더불어민주당, 통합시당 위원장 후보들을 이어서 만나보고 있는데요. 조계원 의원 : 고맙습니다.

💰 (경제) 이찬진 금융감독원장이 오는 14일 취임 1년을 맞는다. 금융권 경험이 없는 법조인 출신이라는 우려 속에서 출발한 이 원장의 첫 1년은 금융감독체계 개편부터 금융소비자 보호 강화, 홍콩H지수 주가연계증권(ELS) 제재까지 굵직한 현안의 연속이었다.

💰 (경제) &quot;30% 이상 떨어지기도 했는데 온갖 조롱 다 견디고 물타기하면서 버티다 보니 1000원만 더 오르면 수익권이에요. 쭉쭉 올라가면 좋겠어요.&quot; 8월 11일 온라인 주식 커뮤니티에 올라온 게시 글들이다.

💰 (경제) ◇ 박재홍&gt; 맨날 똑같이 바쁘시다는 말씀. 일단 최근 정부가 세제개편안을 내놨는데 이것도 많이 시끄러웠습니다.

👥 (사회) 춤·시·국악·현대미술이 천년의 공간에서 하나로 [헤럴드경제=박대성 기자] 대한불교조계종 제19교구 본사 지리산 대화엄사(주지 우석 스님)가 천년의 화엄 사상을 춤과 시 낭송, 국악, 드로잉, 회화, 조각, 설치, 사진 등 동시대 예술로 풀어내며 전통 사찰과 현대예술의 새로운 만남을 선보인다. 지리산 대화엄사는 오는 31일까지 보제루와 성보박물관에서 ‘화엄전(華嚴展)–몸짓과 낭송’을 개최하고, 이어서 프랑스 파리에서 오랜 시간 활동해 온 한국 작가 7인이 참여하는 ‘경계의 화엄(華嚴)–파리에서…

👥 (사회) 정부의 강력한 대출 규제로 ‘대출 오픈런’ 등 자금 수요자의 고충이 커지고 있다. 일부 고신용자는 은행 대출이 막히면서 저축은행 등 제2금융권으로 내몰리기도 했다.

👥 (사회) 이재명 대통령이 국민의힘 소속 전·현직 국회부의장인 주호영(대구 수성갑, 6선), 박덕흠(충북 보은·옥천·영동·괴산, 4선) 의원과 지난 6월 비공개 골프 회동을 가진 것으로 12일 확인됐다. 국회가 후반기 원 구성을 마무리하고 6월 5일 새 의장단을 선출한 직후 마련된 자리로, 조정식 국회의장(경기 시흥을, 6선)도 라운딩에 참여했다.

👥 (사회) 박은정 조국혁신당 의원은 &quot;뜻하지 않게 정치권에 와서 검찰개혁 법안을 추진하고 마무리하게 돼 감회가 남다르다&quot;라며 &quot;검찰청은 사라지지만 검사는 그대로 남는다. 국민을 위해 사건과 수사 기록을 제대로 보고 충실히 공소를 제기하고 범죄 피해자를 위해 공소 유지를 잘해주길 바란다&quot;라고 말했다.

👥 (사회) 최근 성심당의 임산부 우선 입장 &#x27;프리패스&#x27; 제도를 둘러싸고 온라인에서 논쟁이 일었다. 누군가에게는 필요한 배려지만, 누군가에게는 납득하기 어려운 특혜로 비친다는 것이다.

👥 (사회) “그런데 말야, 검찰청을 적대시한다는 건 완전히 반사회적 세력이라는 거야.” 2021년 6월 3일 오후 일본 도쿄도 가쓰시카구 소재 도쿄구치소 조사실에서 도쿄지검 특수부 검사가 피의자에게 한 말이다. 검사는 진술을 거부하는 피의자에게 고함을 치는가 하면 가족과 주변 사람들을 거론하며 압박했다.

👥 (사회) 경상수지가 흑자로 돌아선 이후에도 문화 예술 콘텐츠 부분에는 시간이 더 필요했다. 한국 영화보다 할리우드 영화나 홍콩 영화가 인기를 끌었고, 음악도 지금보다는 팝 음악의 비중이 높았다.

👥 (사회) 1991년 8월14일, 고 김학순 선생이 일본군 ‘위안부’ 피해 사실을 세상에 처음으로 증언했다. 당시 그는 “일본 정부가 정신대를 부인하는 것이 너무 기가 막혀 증언하게 됐다”며 약 50년의 침묵을 깬 이유를 밝혔다.

🌏 (국제) 오는 11월 3일(현지 시간) 미국 중간선거까지 3개월도 남지 않은 시점에 캐럴라인 레빗 백악관 대변인이 사임하기로 했다. 최근 둘째를 출산한 레빗 대변인은 자녀, 가족과 더 많은 시간을 보내기 위한 것이라고 설명했다.

🌏 (국제) 이스라엘과 레바논이 헤즈볼라(레바논 무장단체)의 무장해제 검증에 참여할 후보국으로 영국, 이탈리아, 스위스, 인도네시아를 선정한 것으로 알려졌다. 12일(현지시간) 로이터통신은 복수의 소식통을 인용해 이스라엘과 레바논이 지난주 미국 주도로 이탈리아 로마에서 열린 회담에서 해당 후보군을 결정했다고 보도했다.

<script>
// 홈 화면/사파리가 옛 사본을 보여줄 때: 페이지 날짜가 오늘과 다르면 캐시를 우회해 1회 다시 불러온다
var BUILD_DATE = '2026-08-13';
(function() {
  var d = new Date();
  var today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  if (today !== BUILD_DATE && location.search.indexOf('r=') === -1) {
    location.replace(location.pathname + '?r=' + Date.now());
  }
})();

function markCopied(btn) {
  const original = btn.textContent;
  btn.textContent = '복사됨';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 1200);
}

function copySection(key, btn) {
  // execCommand는 동기적으로 바로 결과가 나오고 권한 프롬프트로 멈추는 일이
  // 없어서 이걸 기본으로 쓴다. navigator.clipboard는 일부 브라우저(특히
  // 자동화/인앱 웹뷰 환경)에서 권한 대기 상태로 무한정 멈출 수 있어서
  // 보조 수단으로만 쓴다.
  const ta = document.getElementById('ta-' + key);
  let copied = false;
  try {
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    copied = document.execCommand('copy');
  } catch (e) {
    copied = false;
  }

  if (copied) {
    markCopied(btn);
    return;
  }

  const text = window['__content_' + key];
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => markCopied(btn)).catch(() => {
      alert('복사에 실패했습니다. 아래 미리보기 텍스트를 직접 길게 눌러 복사해주세요.');
    });
  } else {
    alert('복사에 실패했습니다. 아래 미리보기 텍스트를 직접 길게 눌러 복사해주세요.');
  }
}
</script>
