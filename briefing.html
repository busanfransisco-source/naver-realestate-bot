👥 (사회) 경찰이 마약사범의 일방적 진술만으로 &#x27;간첩 수사&#x27;에 착수했다가 사건을 종결한 사실이 뒤늦게 드러났다. 수사 과정에서 경찰이 간첩 혐의를 뒷받침할 물증이 없다고 인정했다는 진술도 나왔다.

🌏 (국제) 중국이 과잉생산 해소를 위해 수출을 확대하고 무역흑자를 늘리는 정책은 선후진국 가리지 않고 제조업 육성 열망을 저해하면서 불만을 사고 있다. 중국이 지난 20년간 역사상 최대 규모의 무역 흑자를 기록한 것은 세계 경제에 디플레이션 효과를 가져왔지만 이제는 정치적, 구조적으로 지속 불가능하며 위험을 초래하고 있다.

<script>
// 홈 화면/사파리가 옛 사본을 보여줄 때: 페이지 날짜가 오늘과 다르면 캐시를 우회해 1회 다시 불러온다
var BUILD_DATE = '2026-08-14';
(function() {
  var d = new Date();
  var today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  if (today !== BUILD_DATE && location.search.indexOf('r=') === -1) {
    location.replace(location.pathname + '?r=' + Date.now());
  }
})();

function markCopied(btn) {
  const original = btn.textContent;
  btn.textContent = '복사됨';
  btn.classList.add('copied');
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 1200);
}

function copySection(key, btn) {
  // execCommand는 동기적으로 바로 결과가 나오고 권한 프롬프트로 멈추는 일이
  // 없어서 이걸 기본으로 쓴다. navigator.clipboard는 일부 브라우저(특히
  // 자동화/인앱 웹뷰 환경)에서 권한 대기 상태로 무한정 멈출 수 있어서
  // 보조 수단으로만 쓴다.
  const ta = document.getElementById('ta-' + key);
  let copied = false;
  try {
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    copied = document.execCommand('copy');
  } catch (e) {
    copied = false;
  }

  if (copied) {
    markCopied(btn);
    return;
  }

  const text = window['__content_' + key];
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => markCopied(btn)).catch(() => {
      alert('복사에 실패했습니다. 아래 미리보기 텍스트를 직접 길게 눌러 복사해주세요.');
    });
  } else {
    alert('복사에 실패했습니다. 아래 미리보기 텍스트를 직접 길게 눌러 복사해주세요.');
  }
}
</script>
